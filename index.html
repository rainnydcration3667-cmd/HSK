<style>
:root{
  --paper:#F1F4F0; --card:#FFFFFF;
  --ink:#16211F; --ink-2:#5A6B67; --ink-3:#9AAAA5;
  --jade:#1D6F5E; --jade-pale:#DCEBE4; --jade-line:#B7D3C8;
  --cinnabar:#B3402F; --cinnabar-pale:#F7E3DE;
  --amber:#96731A; --amber-pale:#F4EBD4;
  --rule:#D5DEDA;
  --han:"Songti SC","SimSun","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
#app-root *{box-sizing:border-box;margin:0;padding:0}
#app-root{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;padding:16px 13px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto}

.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-family:var(--han);font-size:18px;letter-spacing:.05em}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.5}
.meta b{font-size:16px;color:var(--ink)}
.rail{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:18px}
.rail i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s ease}
@media(prefers-reduced-motion:reduce){.rail i{transition:none}}

.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:22px 18px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
h2{font-family:var(--han);font-size:22px;font-weight:400;margin-bottom:8px}
.lead{font-size:13.5px;color:var(--ink-2);line-height:1.65}

.btn{padding:11px 14px;border:1px solid var(--rule);background:var(--card);border-radius:3px;font-family:var(--sans);font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s}
.btn:hover{background:var(--jade-pale);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
.btn.solid{background:var(--jade);color:#fff;border-color:var(--jade)}
.btn.solid:hover{background:#175c4e;color:#fff}
.btn.warn:hover{background:var(--cinnabar-pale);color:var(--cinnabar)}
.row{display:flex;gap:8px;margin-top:16px}
.row .btn{flex:1}

/* chọn số từ */
.pick{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:16px 0 6px}
.pick button{flex:1;padding:14px 6px;border:0;border-right:1px solid var(--rule);background:var(--card);cursor:pointer;font-family:var(--mono);font-size:19px;color:var(--ink-2)}
.pick button:last-child{border-right:0}
.pick button.on{background:var(--jade);color:#fff}
.pick button:hover:not(.on){background:var(--jade-pale)}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6}

/* bảng xem trước */
.timer{font-family:var(--mono);font-size:30px;letter-spacing:.04em;color:var(--jade)}
.timer.low{color:var(--cinnabar)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.pcell{border:1px solid var(--rule);border-radius:3px;background:var(--card);padding:11px 10px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.pcell:hover{border-color:var(--jade-line)}
.pcell:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
.pcell .hz{font-family:var(--han);font-size:26px;line-height:1.2}
.pcell .py{font-family:var(--mono);font-size:11px;color:var(--jade);margin-top:4px;min-height:15px}
.pcell .vi{font-size:12.5px;color:var(--ink-2);margin-top:2px;min-height:17px}
.pcell.hidden .py,.pcell.hidden .vi{visibility:hidden}
.pcell.known{background:var(--jade-pale);border-color:var(--jade-line)}
.pcell .tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin-top:6px;display:none}
.pcell.known .tag{display:block}

/* ô hỏi */
.q-hz{font-family:var(--han);font-size:66px;line-height:1.15;text-align:center;letter-spacing:.08em}
.q-vi{font-family:Georgia,serif;font-size:32px;line-height:1.25;text-align:center}
.fields{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.field{flex:1 1 190px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
.field label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:8px 11px 0}
.field input{width:100%;border:0;outline:0;background:transparent;padding:5px 11px 11px;font-size:17px;color:var(--ink);font-family:var(--sans)}
.field.mono input{font-family:var(--mono);letter-spacing:.08em}
.field input::placeholder{color:var(--ink-3);font-size:13px;letter-spacing:0}
.field:focus-within{border-color:var(--jade)}
.field.ok{border-color:var(--jade);background:var(--jade-pale)}
.field.no{border-color:var(--cinnabar);background:var(--cinnabar-pale)}

/* bảng đáp án */
.answer{border:1px solid var(--jade-line);border-radius:3px;background:var(--jade-pale);padding:16px;text-align:center;margin-bottom:16px}
.answer.bad{border-color:var(--cinnabar);background:var(--cinnabar-pale)}
.answer .a-hz{font-family:var(--han);font-size:44px;line-height:1.2;letter-spacing:.08em}
.answer .a-py{font-family:var(--mono);font-size:16px;color:var(--jade);margin-top:6px;letter-spacing:.05em}
.answer.bad .a-py{color:var(--cinnabar)}
.answer .a-vi{font-family:Georgia,serif;font-size:19px;margin-top:6px}
.answer .a-alt{font-size:11.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.verdict{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;color:var(--jade)}
.answer.bad .verdict{color:var(--cinnabar)}

/* IME vòng ngược */
.slots{display:flex;gap:11px;justify-content:center;margin:22px 0 4px;flex-wrap:wrap}
.slot{width:70px;height:70px;position:relative;border:1px solid var(--jade-line);display:flex;align-items:center;justify-content:center;font-family:var(--han);font-size:43px;background:var(--card)}
.slot.empty::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--jade-line)}
.slot.empty::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--jade-line)}
.slot.active{border-color:var(--jade);border-width:2px;background:var(--jade-pale)}
.slot.bad{border-color:var(--cinnabar);background:var(--cinnabar-pale);animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.slot.bad{animation:none}}
.cands{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-top:0;border-radius:0 0 3px 3px;background:var(--card);min-height:54px}
.cand{flex:1 1 0;min-width:52px;border:0;border-right:1px solid var(--rule);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 3px;font-family:var(--han);font-size:26px;color:var(--ink)}
.cand:last-child{border-right:0}
.cand:hover{background:var(--jade-pale)}
.cand:focus-visible{outline:2px solid var(--jade);outline-offset:-2px}
.cand i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--ink-3)}
.cands .idle{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-3);padding:14px;text-align:center;line-height:1.5}
.imebox{margin-top:18px}
.imebox .field{border-radius:3px 3px 0 0}

/* tổng kết */
.grid3{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:18px 0}
.grid3 div{flex:1;padding:14px 6px;border-right:1px solid var(--rule);text-align:center}
.grid3 div:last-child{border-right:0}
.grid3 b{display:block;font-family:var(--mono);font-size:21px}
.grid3 span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--cinnabar);color:var(--cinnabar);border-radius:2px;padding:5px 9px;font-family:var(--han);font-size:16px}
.chip em{font-family:var(--mono);font-style:normal;font-size:10px;margin-left:5px;opacity:.75}
h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px;font-weight:600}

textarea{width:100%;min-height:150px;border:1px solid var(--rule);border-radius:3px;padding:11px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical}
textarea:focus{outline:2px solid var(--jade);outline-offset:-1px}
.foot{margin-top:16px;font-size:11px;color:var(--ink-3);line-height:1.7;text-align:center}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--card);color:var(--ink-2)}
@media(max-width:430px){
  .q-hz{font-size:52px}.q-vi{font-size:26px}
  .slot{width:60px;height:60px;font-size:36px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
}
</style>

/* ══════════════════════════════════════════
   2. CHUẨN CHẤM
   Nghĩa: bỏ dấu + bỏ dấu câu (chuẩn Duolingo) + Levenshtein
          ngưỡng ≤3 kt: 0 lỗi · 4–7: 1 lỗi · ≥8: 2 lỗi (chuẩn Algolia)
   Pinyin: chỉ chấm phần âm, bỏ hoàn toàn thanh điệu. Thanh điệu chỉ hiện ở đáp án.
   ══════════════════════════════════════════ */
const stripMarks=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const normVi=s=>stripMarks(String(s).toLowerCase()).replace(/đ/g,"d")
  .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
const barePy=s=>stripMarks(String(s).toLowerCase()).replace(/[^a-z]/g,"").replace(/v/g,"u");
const TONEMAP={"\u0304":1,"\u0301":2,"\u030c":3,"\u0300":4};
function tonesOf(py){return py.trim().split(/\s+/).map(sy=>{
  const d=sy.normalize("NFD");let t=5;
  for(const ch of d)if(TONEMAP[ch])t=TONEMAP[ch];
  return t;});}

function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];}
  return prev[n];
}
function allowance(len){return len<=3?0:len<=7?1:2}

function gradeVi(input,accepted){
  const u=normVi(input);
  if(!u)return{ok:false,how:"empty"};
  for(const a of accepted)if(u===normVi(a))return{ok:true,how:"exact"};
  for(const a of accepted){
    const t=normVi(a);
    if(lev(u,t)<=allowance(t.length))return{ok:true,how:"typo",meant:a};
  }
  return{ok:false,how:"wrong"};
}
function gradePy(input,py){
  const u=barePy(input);
  if(!u)return{ok:false,tone:null};
  const target=barePy(py);
  const ok=u===target||(target.length>=8&&lev(u,target)<=1);
  return{ok};
}

function importDB(file,done){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      DB.words=Object.assign(DB.words,d.words||{});
      DB.extra=Object.assign(DB.extra,d.extra||{});
      DB.custom=(DB.custom||[]).concat(d.custom||[]);
      await save();buildLex();buildIndex();done(true,Object.keys(DB.words).length);
    }catch(e){done(false)}
  };
  r.readAsText(file);
}

let LEX=[];
function buildLex(){
  const raw=(REMOTE||BUILTIN).concat(SERVER?[]:(DB.custom||[]));
  const seen=new Set();LEX=[];
  raw.forEach(([hz,py,vi])=>{
    if(seen.has(hz))return;seen.add(hz);
    const chars=[...hz], pys=py.trim().split(/\s+/);
    LEX.push({hz,py,pys,chars,vi:vi.split("|").map(s=>s.trim()).filter(Boolean)});
  });
}
const INDEX={};
function buildIndex(){
  for(const k in INDEX)delete INDEX[k];
  const add=(s,c)=>{(INDEX[s]=INDEX[s]||new Set()).add(c)};
  LEX.forEach(w=>w.chars.forEach((c,i)=>{if(w.pys[i])add(barePy(w.pys[i]),c)}));
  Object.entries(POOL).forEach(([s,cs])=>[...cs].forEach(c=>add(s,c)));
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function candidates(typed,answer){
  const t=barePy(typed);if(!t)return[];
  let set=INDEX[t]?[...INDEX[t]]:[];
  if(set.length<4)Object.keys(INDEX).forEach(k=>{if(k.startsWith(t))set=set.concat([...INDEX[k]])});
  set=[...new Set(set)].filter(c=>c!==answer);
  const out=shuffle(set).slice(0,8);
  out.splice(Math.floor(Math.random()*(out.length+1)),0,answer);
  return out;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function acceptedFor(w){return w.vi.concat(DB.extra[w.hz]||[])}

/* ── Lịch ôn giãn cách (biến thể SM-2) ── */
function applyGrade(w,g){
  const s=Object.assign({n:0,e:0,iv:0,ef:2.5,lap:0},DB.words[w.hz]||{});
  s.n++;
  if(g===0){
    s.e++;s.lap++;s.ef=Math.max(1.3,s.ef-0.2);s.iv=0;s.due=addDays(today(),1);
  }else{
    if(!s.iv)s.iv=1;
    else if(s.iv===1)s.iv=g===1?2:3;
    else s.iv=Math.max(s.iv+1,Math.round(s.iv*(g===1?1.25:s.ef)));
    s.iv=Math.min(s.iv,MAX_IV);
    s.ef=g===1?Math.max(1.3,s.ef-0.15):Math.min(2.8,s.ef+0.05);
    s.due=addDays(today(),s.iv);
  }
  s.last=today();DB.words[w.hz]=s;
}

/* ── Mục Học lại: ra khỏi mục khi đúng 2 lượt liên tiếp ── */
function relearnAdd(hz){DB.relearn=DB.relearn||{};if(!DB.relearn[hz])DB.relearn[hz]={streak:0}}
function relearnMark(hz,ok){
  DB.relearn=DB.relearn||{};
  const r=DB.relearn[hz];if(!r)return;
  r.streak=ok?(r.streak||0)+1:0;
  if(r.streak>=2)delete DB.relearn[hz];
}
const relearnList=()=>LEX.filter(w=>DB.relearn&&DB.relearn[w.hz]);

function counts(){
  const t=today();
  let due=0,fresh=0;
  LEX.forEach(w=>{const s=DB.words[w.hz];if(!s)fresh++;else if(!s.due||s.due<=t)due++});
  if(DB.day!==t){DB.day=t;DB.newToday=0}
  return{due,fresh,relearn:relearnList().length,left:Math.max(0,50-(DB.newToday||0))};
}

function pickBatch(kind){
  const t=today();
  if(DB.day!==t){DB.day=t;DB.newToday=0}
  if(kind==="relearn"){
    newOnes=[];batch=shuffle(relearnList());
    return{due:batch.length,fresh:0};
  }
  const dueW=LEX.filter(w=>{const s=DB.words[w.hz];return s&&(!s.due||s.due<=t)})
    .sort((a,b)=>((DB.words[a.hz].due||"")<(DB.words[b.hz].due||"")?-1:1)).slice(0,MAX_DUE);
  const freshW=LEX.filter(w=>!DB.words[w.hz]).slice(0,size);
  newOnes=freshW.slice();
  DB.newToday=(DB.newToday||0)+freshW.length;save();
  batch=shuffle(dueW.concat(freshW));
  return{due:dueW.length,fresh:freshW.length};
}

/* ước tính thời gian: ~13 giây cho vòng gõ nghĩa, ~7 giây cho vòng chọn chữ */
function estimate(n,p){
  const sec=n*p*20+p*n*1.2;
  const m=Math.round(sec/60);
  return m<60?m+" phút":Math.floor(m/60)+" giờ "+(m%60?m%60+" phút":"");
}

}

    ${plan?`<div class="answer" style="margin:16px 0 0;text-align:left;padding:12px 14px">

      <b>${plan*passes*2} lượt trả lời</b><br>Ước tính khoảng <b>${estimate(plan,passes)}</b>. Giữa mỗi lượt đều có nút kết thúc sớm.</div>

    <div class="row">

    <p class="note" style="margin:6px 0 10px"><b style="color:var(--cinnabar)">${c.relearn} từ</b> đã qua đủ số lượt mà vẫn chưa đúng được lần nào. Chúng nằm đây tới khi bạn trả lời đúng <b>2 lượt liên tiếp</b>. Luyện mục này không làm giãn lịch ôn.</p>

      ?`Đã khôi phục. Hiện có lịch sử của <b>${n}</b> từ.`

/* ---------- Bắt đầu phiên ---------- */
function startSession(hasNew){
  pass=1;scored={};times=[];passLog=[];
  batch.forEach(w=>scored[w.hz]=0);
  hasNew?startPreview():startPass();
}

/* ---------- Xem trước 15 phút (chỉ từ mới) ---------- */
function startPreview(){
  left=900;known=new Set();
  screenPreview();
  clearInterval(tick);
  tick=setInterval(()=>{
    left--;
    const t=document.getElementById("clk");
    if(t){t.textContent=fmt(left);t.className="timer"+(left<=60?" low":"")}
    if(left<=0){clearInterval(tick);startPass()}
  },1000);
}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

function screenPreview(){
  el().innerHTML=`<div class="wrap">
  ${head("认字阶段","Xem trước — từ mới",`<span id="clk" class="timer">${fmt(left)}</span>`,0)}
  <div class="card">
    <div class="eyebrow">${newOnes.length} từ mới · bấm vào thẻ để lật</div>
    <h2>Nhìn chữ, tự đoán nghĩa, rồi mới lật</h2>
    <p class="lead">Đoán trước khi lật là chỗ trí nhớ hình thành. Thẻ nào đoán đúng ngay, bấm lần nữa để đánh dấu <b>đã thuộc</b> — chúng sẽ xếp cuối ở vòng làm bài.</p>
    <div class="plist">${newOnes.map(w=>`
      <button class="pcell hidden" data-h="${esc(w.hz)}">
        <div class="hz">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div>
        <div class="vi">${esc(w.vi[0])}</div><div class="tag">Đã thuộc</div>
      </button>`).join("")}</div>
    <div class="row">
      <button class="btn solid" id="skip">Xong rồi, vào làm bài →</button>
      <button class="btn" id="all">Lật hết</button>
    </div>
  </div></div>`;
  bindCards();
  document.getElementById("all").onclick=()=>document.querySelectorAll(".pcell").forEach(b=>b.classList.remove("hidden"));
  document.getElementById("skip").onclick=()=>{clearInterval(tick);startPass()};
}
function bindCards(){
  document.querySelectorAll(".pcell").forEach(b=>b.onclick=()=>{
    const h=b.dataset.h;
    if(b.classList.contains("hidden"))b.classList.remove("hidden");
    else if(!b.classList.contains("known")){b.classList.add("known");known.add(h)}
    else{b.classList.remove("known");known.delete(h)}
  });
}

/* ---------- Mỗi lượt: nhìn lại rồi làm bài ---------- */
function startPass(){
  clearInterval(tick);
  if(pass===1&&known.size)batch=batch.filter(w=>!known.has(w.hz)).concat(batch.filter(w=>known.has(w.hz)));
  else batch=shuffle(batch);
  screenReview();
}

function screenReview(){
  const pct=Math.round((pass-1)/passes*100);
  el().innerHTML=`<div class="wrap">
  ${head("温习一遍","Nhìn lại trước lượt "+pass,`<b>${pass}/${passes}</b><br>lượt`,pct)}
  <div class="card">
    <div class="eyebrow">${batch.length} từ · bấm để lật · không đếm giờ</div>
    <h2>${pass===1?"Lướt qua một lượt rồi bắt đầu":"Xem lại trước khi làm lượt "+pass}</h2>
    <p class="lead">${pass===1
      ?"Chưa cần nhớ hết. Chỉ cần nhìn qua để mặt chữ có chỗ bám."
      :"Lượt trước bạn còn "+(passLog.length?passLog[passLog.length-1].miss:0)+" từ sai. Nhìn kỹ những từ đó."}</p>
    <div class="plist">${batch.map(w=>`
      <button class="pcell ${scored[w.hz]?"":"hidden"}" data-h="${esc(w.hz)}">
        <div class="hz">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div>
        <div class="vi">${esc(w.vi[0])}</div><div class="tag">Đã thuộc</div>
      </button>`).join("")}</div>
    <div class="row">
      <button class="btn solid" id="begin">Làm lượt ${pass} →</button>
      <button class="btn" id="all">Lật hết</button>
    </div>
  </div></div>`;
  document.querySelectorAll(".pcell").forEach(b=>b.onclick=()=>b.classList.toggle("hidden"));
  document.getElementById("all").onclick=()=>document.querySelectorAll(".pcell").forEach(b=>b.classList.remove("hidden"));
  document.getElementById("begin").onclick=startRound1;
}

/* ---------- Vòng 1: chữ → nghĩa + pinyin ---------- */
function startRound1(){qi=0;pHit=pMiss=0;askR1()}
function askR1(){
  if(qi>=batch.length)return startRound2();
  answered=false;lastGrade=null;t0=Date.now();screenR1();
}
function screenR1(){
  const w=batch[qi];
  const pct=Math.round(((pass-1)+qi/batch.length/2)/passes*100);
  el().innerHTML=`<div class="wrap">
  ${head("看字写义","Lượt "+pass+" · vòng 1",`<b>${qi+1}/${batch.length}</b><br>lượt ${pass}/${passes}`,pct)}
  ${answered?answerPanel(w):""}
  <div class="card">
    <div class="eyebrow">Gõ nghĩa và pinyin, rồi bấm Kiểm tra</div>
    <div class="q-hz">${esc(w.hz)}</div>
    <div class="fields">
      <div class="field ${lastGrade?(lastGrade.vi.ok?"ok":"no"):""}">
        <label for="fvi">Nghĩa tiếng Việt</label>
        <input id="fvi" autocomplete="off" placeholder="gõ nghĩa…" ${answered?"disabled":""} value="${answered?esc(lastGrade.viRaw):""}">
      </div>
      <div class="field mono ${lastGrade?(lastGrade.py.ok?"ok":"no"):""}">
        <label for="fpy">Pinyin</label>
        <input id="fpy" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ không dấu, vd: jingji" ${answered?"disabled":""} value="${answered?esc(lastGrade.pyRaw):""}">
      </div>
    </div>
    <div class="row">
      ${answered
        ?`<button class="btn solid" id="next">Từ tiếp theo →</button>
          ${lastGrade.vi.ok?"":`<button class="btn" id="mine">Tính là đúng</button>`}`
        :`<button class="btn solid" id="check">Kiểm tra</button>
          <button class="btn warn" id="pass">Chưa nhớ</button>`}
    </div>
  </div>
  <p class="foot"><kbd>Enter</kbd> kiểm tra rồi sang từ tiếp · <kbd>Tab</kbd> chuyển ô<br>
  Bỏ dấu tiếng Việt vẫn tính đúng · pinyin gõ không thanh điệu.</p></div>`;

  if(!answered){
    const a=document.getElementById("fvi");a.focus();
    const go=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
    a.onkeydown=go;document.getElementById("fpy").onkeydown=go;
    document.getElementById("check").onclick=check;
    document.getElementById("pass").onclick=()=>{
      pMiss++;answered=true;
      lastGrade={vi:{ok:false,how:"pass"},py:{ok:false},viRaw:"",pyRaw:""};screenR1();
    };
  }else{
    const n=document.getElementById("next");n.focus();
    n.onclick=()=>{qi++;askR1()};
    document.onkeydown=e=>{if(e.key==="Enter"&&answered){e.preventDefault();document.onkeydown=null;qi++;askR1()}};
    const m=document.getElementById("mine");
    if(m)m.onclick=async()=>{
      const raw=lastGrade.viRaw.trim();
      if(raw){(DB.extra[w.hz]=DB.extra[w.hz]||[]).push(raw);await save()}
      pMiss--;pHit++;scored[w.hz]=(scored[w.hz]||0)+1;
      lastGrade.vi={ok:true,how:"override"};screenR1();
    };
  }
}
function answerPanel(w){
  const g=lastGrade,good=g.vi.ok&&g.py.ok;
  let verdict=good?"Đúng cả hai":g.vi.ok?"Nghĩa đúng · pinyin sai":g.py.ok?"Pinyin đúng · nghĩa sai":"Chưa đúng";
  if(g.vi.how==="pass")verdict="Đã bỏ qua";
  if(g.vi.how==="typo")verdict="Đúng — sai chính tả nhẹ";
  if(g.vi.how==="override")verdict="Đã ghi nhận cách dịch của bạn";
  const alts=acceptedFor(w).slice(1);
  return `<div class="answer ${good?"":"bad"}">
    <div class="verdict">${verdict}</div>
    <div class="a-hz">${esc(w.hz)}</div>
    <div class="a-py">${esc(w.py)}</div>
    <div class="a-vi">${esc(w.vi[0])}</div>
    ${alts.length?`<div class="a-alt">Cũng được chấp nhận: ${alts.map(esc).join(" · ")}</div>`:""}
  </div>`;
}
function check(){
  const w=batch[qi];
  const viRaw=document.getElementById("fvi").value,pyRaw=document.getElementById("fpy").value;
  const vi=gradeVi(viRaw,acceptedFor(w)),py=gradePy(pyRaw,w.py);
  lastGrade={vi,py,viRaw,pyRaw};answered=true;times.push(Date.now()-t0);
  if(vi.ok&&py.ok){pHit++;scored[w.hz]=(scored[w.hz]||0)+1}else pMiss++;
  screenR1();
}

/* ---------- Vòng 2: nghĩa → chọn mặt chữ ---------- */
function startRound2(){
  rev=shuffle(batch.slice());ri=0;rpos=0;rtyped="";rstrike=0;r2Hit=r2Miss=0;
  rev.length?screenR2():endPass();
}
function screenR2(){
  const w=rev[ri];
  const pct=Math.round(((pass-1)+0.5+ri/rev.length/2)/passes*100);
  const cands=candidates(rtyped,w.chars[rpos]);
  el().innerHTML=`<div class="wrap">
  ${head("写义选字","Lượt "+pass+" · vòng 2",`<b>${ri+1}/${rev.length}</b><br>lượt ${pass}/${passes}`,pct)}
  <div class="card">
    <div class="eyebrow">Gõ pinyin từng chữ, rồi chọn đúng mặt chữ</div>
    <div class="q-vi">${esc(w.vi[0])}</div>
    <div class="slots">${w.chars.map((c,i)=>{
      const cls=i<rpos?"slot":i===rpos?(rstrike?"slot active bad":"slot active"):"slot empty";
      return `<div class="${cls}">${i<rpos?esc(c):""}</div>`}).join("")}</div>
    <div class="imebox">
      <div class="field mono">
        <label for="rbuf">Pinyin chữ thứ ${rpos+1}</label>
        <input id="rbuf" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(rtyped)}" placeholder="gõ âm…">
      </div>
      <div class="cands">${cands.length
        ?cands.map((c,i)=>`<button class="cand" data-c="${esc(c)}"><span>${esc(c)}</span><i>${i+1}</i></button>`).join("")
        :`<div class="idle">Gợi ý hiện ra khi bạn gõ. Thứ tự xáo lại mỗi lần.</div>`}</div>
    </div>
    <div class="row"><button class="btn warn" id="rskip">Chưa nhớ, bỏ qua</button></div>
  </div>
  <p class="foot"><kbd>1</kbd>–<kbd>9</kbd> chọn chữ · <kbd>Esc</kbd> xoá ô pinyin</p></div>`;
  const b=document.getElementById("rbuf");
  b.focus();b.setSelectionRange(rtyped.length,rtyped.length);
  b.oninput=e=>{rtyped=e.target.value.replace(/[^a-zA-Z]/g,"").toLowerCase();screenR2()};
  b.onkeydown=e=>{
    if(/^[1-9]$/.test(e.key)){e.preventDefault();rpick(cands[+e.key-1])}
    else if(e.key==="Escape"){e.preventDefault();rtyped="";screenR2()}};
  document.querySelectorAll(".cand").forEach(x=>x.onclick=()=>rpick(x.dataset.c));
  document.getElementById("rskip").onclick=()=>{r2Miss++;nextRev()};
}
function rpick(c){
  if(!c)return;
  const w=rev[ri];
  if(c===w.chars[rpos]){
    rpos++;rtyped="";
    if(rpos>=w.chars.length){rstrike?r2Miss++:r2Hit++;return nextRev()}
    screenR2();
  }else{rstrike++;screenR2()}
}
function nextRev(){ri++;rpos=0;rtyped="";rstrike=0;ri>=rev.length?endPass():screenR2()}

/* ---------- Kết thúc một lượt ---------- */
function endPass(){
  passLog.push({hit:pHit,miss:pMiss,r2:r2Hit});
  const done=batch.filter(w=>scored[w.hz]).length;
  if(pass>=passes)return finish();
  const pct=Math.round(pass/passes*100);
  el().innerHTML=`<div class="wrap">
  ${head("一轮结束","Xong lượt "+pass,`<b>${pass}/${passes}</b><br>lượt`,pct)}
  <div class="card">
    <div class="eyebrow">Lượt ${pass} trên ${passes}</div>
    <h2>${pMiss?pMiss+" từ còn sai":"Đúng hết lượt này"}</h2>
    <div class="grid3">
      <div><b>${pHit}</b><span>Đúng vòng 1</span></div>
      <div><b style="color:${pMiss?"var(--cinnabar)":"var(--ink-3)"}">${pMiss}</b><span>Sai vòng 1</span></div>
      <div><b>${done}/${batch.length}</b><span>Đã đúng ít nhất 1 lượt</span></div>
    </div>
    <p class="lead">${done===batch.length
      ?"Toàn bộ từ đã đúng ít nhất một lượt. Làm tiếp để chắc, hoặc kết thúc ở đây."
      :"Còn "+(batch.length-done)+" từ chưa đúng lần nào. Chúng sẽ vào mục Học lại nếu hết "+passes+" lượt vẫn vậy."}</p>
    <div class="row">
      <button class="btn solid" id="cont">Lượt ${pass+1} →</button>
      <button class="btn warn" id="stop">Kết thúc sớm</button>
    </div>
  </div></div>`;
  document.getElementById("cont").onclick=()=>{pass++;startPass()};
  document.getElementById("stop").onclick=finish;
}

/* ---------- Kết thúc phiên ---------- */
function finish(){
  const stuck=batch.filter(w=>!scored[w.hz]);
  if(mode==="relearn"){
    batch.forEach(w=>relearnMark(w.hz,!!scored[w.hz]));
  }else{
    batch.forEach(w=>{
      const c=scored[w.hz]||0;
      applyGrade(w,c===0?0:(c>=pass?2:1));
    });
    stuck.forEach(w=>relearnAdd(w.hz));
  }
  save();
  const avg=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(1):"0";
  const buckets=[0,0,0];
  batch.forEach(w=>{const s=DB.words[w.hz];if(!s||!s.due)return;
    const d=daysTo(s.due);buckets[d<=1?0:d<=4?1:2]++});
  const left=relearnList().length;
  el().innerHTML=`<div class="wrap">
  ${head("今日完成","Xong phiên","",100)}
  <div class="card">
    <div class="eyebrow">${batch.length} từ · ${pass} lượt đã làm</div>
    <h2>${stuck.length?stuck.length+" từ vào mục Học lại":"Xong sạch"}</h2>
    <div class="grid3">
      <div><b>${batch.length-stuck.length}</b><span>Đã đúng</span></div>
      <div><b style="color:${stuck.length?"var(--cinnabar)":"var(--ink-3)"}">${stuck.length}</b><span>Chưa đúng lần nào</span></div>
      <div><b>${avg}s</b><span>TB mỗi từ</span></div>
    </div>
    ${mode==="relearn"
      ?`<p class="lead">Phiên học lại — lịch ôn giữ nguyên. Từ nào đúng hai lượt liên tiếp đã được gỡ khỏi mục. Còn <b>${left}</b> từ trong mục.</p>`
      :`<h3>Lịch ôn đã đặt</h3>
        <div class="grid3">
          <div><b>${buckets[0]}</b><span>Ngày mai</span></div>
          <div><b>${buckets[1]}</b><span>2–4 ngày</span></div>
          <div><b>${buckets[2]}</b><span>5 ngày trở lên</span></div>
        </div>`}
    ${stuck.length?`<h3>Vào mục Học lại</h3>
      <div class="plist">${stuck.map(w=>`
        <div class="pcell" style="cursor:default">
          <div class="hz">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div>
          <div class="vi">${esc(acceptedFor(w).join(" / "))}</div>
        </div>`).join("")}</div>`:""}
    <div class="row" style="margin-top:20px">
      <button class="btn solid" id="again">Về trang chính</button>
      ${left?`<button class="btn" id="more" style="border-color:var(--cinnabar);color:var(--cinnabar)">Học lại ${left} từ →</button>`:""}
    </div>
  </div>
  <p class="foot">Mở app đúng ngày quan trọng hơn học lâu một buổi.</p></div>`;
  document.getElementById("again").onclick=()=>{mode="normal";screenSetup()};
  const mo=document.getElementById("more");
  if(mo)mo.onclick=()=>{mode="relearn";pickBatch("relearn");startSession(false)};
}

function screenImport(){
  el().innerHTML=`<div class="wrap">
  ${head("导入词表","Nạp danh sách từ","",0)}
  <div class="card">
    <div class="eyebrow">Mỗi dòng một từ</div>
    <h2>Dán danh sách vào đây</h2>
    <p class="lead">Định dạng: <b>chữ Hán</b> · <b>pinyin có dấu, cách nhau bằng dấu cách</b> · <b>nghĩa tiếng Việt</b>, ngăn cách bằng dấu phẩy, tab hoặc gạch đứng. Nhiều cách dịch cho cùng một từ thì ngăn bằng dấu <b>/</b>.</p>
    <p class="note" style="margin:12px 0">Ví dụ:<br>
      <span style="font-family:var(--mono)">经济, jīng jì, kinh tế / nền kinh tế</span><br>
      <span style="font-family:var(--mono)">贸易, mào yì, mậu dịch / thương mại</span></p>
    <textarea id="ta" placeholder="经济, jīng jì, kinh tế / nền kinh tế"></textarea>
    <div id="msg" class="note" style="margin-top:10px"></div>
    <div class="row">
      <button class="btn solid" id="ok">Nạp vào kho</button>
      <button class="btn" id="back">Quay lại</button>
    </div>
    ${(DB.custom&&DB.custom.length)?`<div class="row"><button class="btn warn" id="clr">Xoá ${DB.custom.length} từ đã nạp</button></div>`:""}
  </div></div>`;
  document.getElementById("back").onclick=screenSetup;
  const c=document.getElementById("clr");
  if(c)c.onclick=async()=>{DB.custom=[];await save();buildLex();buildIndex();screenImport()};
  document.getElementById("ok").onclick=async()=>{
    const lines=document.getElementById("ta").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const good=[],bad=[];
    lines.forEach(l=>{
      const p=l.split(/\s*[,\t|]\s*/).filter(Boolean);
      if(p.length<3||!/[\u4e00-\u9fff]/.test(p[0])){bad.push(l);return}
      good.push([p[0],p[1],p.slice(2).join(" ").split("/").map(s=>s.trim()).join("|")]);
    });
    DB.custom=(DB.custom||[]).concat(good);
    let extra="";
    if(SERVER){
      DB.custom=[];
      const r=await pushWords(good);
      extra=r?` Đã ghi thẳng vào <b>tuvung.csv</b> (${r.added} dòng mới).`:"";
    }
    await save();buildLex();buildIndex();
    document.getElementById("msg").innerHTML=
      `Đã nạp <b>${good.length}</b> từ. Kho hiện có <b>${LEX.length}</b> từ.`+extra+
      (bad.length?` Bỏ qua ${bad.length} dòng sai định dạng.`:"");
  };
}
boot().then(()=>{buildLex();buildIndex();screenSetup()});
})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
